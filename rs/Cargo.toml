[package]
name = "sns"
version = "0.6.0"
edition = "2024"
description = "Portable sns binary — Rust port of the TypeScript CLI in ../src (catch-up, not tip of spear)"

[dependencies]
aes-gcm = "0.11.1"
argon2 = "0.6.0"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.7", features = ["derive"] }
fancy-regex = "0.20.2"
getrandom = "0.4.3"
hex = "0.4.3"
hkdf = "0.13.0"
indexmap = "2.14.2"
k256 = { version = "0.14.0", features = ["ecdh"] }
jiff = "0.2.43"
libc = "0.2.191"
regex = "1.13.1"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls-webpki-roots-no-provider"] }
rpassword = "7.5.5"
rusqlite = { version = "0.42.0", features = ["bundled"] }
rustls = { version = "0.23.46", features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
terminal_size = "0.4.4"
url = "2.5.8"
zeroize = "1.9.1"

# macOS custody transport (rs/src/keychain.rs): SecItem spoken in-process,
# so no subprocess ever carries the session key. The -sys crate is a direct
# dependency because errSecItemNotFound is not re-exported by the wrapper.
# Target-gated: Linux never compiles or links either crate.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7", default-features = false }
security-framework-sys = { version = "2.17", default-features = false }

# The bundled libsqlite3-sys amalgamation is swapped for SQLite3 Multiple
# Ciphers (the upstream of better-sqlite3-multiple-ciphers), so the cache
# keeps its chacha20 at-rest encryption with the same pragmas and defaults.
# The vendored copy lives in rs/libsqlite3-sys/ — its sqlite3/ dir holds the
# sqlite3mc amalgamation in place of stock sqlite3.
[patch.crates-io]
libsqlite3-sys = { path = "libsqlite3-sys" }

# Argon2 with 64 MiB of memory is unusably slow in an unoptimized debug build;
# test (and its dev-profile) runs get the same optimization level as release.
[profile.test]
opt-level = 2

# The shipped artifact is a portable single binary: cross-crate LTO, one
# codegen unit, symbols stripped — smallest static build that keeps Argon2
# fast.
[profile.release]
lto = true
codegen-units = 1
strip = true
